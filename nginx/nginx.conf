# nginx gateway: spreads API requests across the API copies started by docker-compose.lb.yml.
events {}

http {
    # Docker's internal DNS server; the list of API copies is re-read every 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_pool {
        zone api_pool 64k;        # shared memory, required by "resolve"
        server api:8000 resolve;  # every running copy of the "api" service
    }

    server {
        listen 80;

        # Shows which API copy answered (proof that the load is shared).
        add_header X-Served-By $upstream_addr always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # A full training can run for more than an hour: do not cut it after 60 s.
        location = /training {
            proxy_pass http://api_pool;
            proxy_read_timeout 3h;
            proxy_send_timeout 3h;
        }

        location / {
            proxy_pass http://api_pool;
        }
    }
}
